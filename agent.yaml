# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: basic-agent
protocols:
  - protocol: responses
    version: 2.0.0
resources:
  cpu: "0.5"
  memory: "1Gi"
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: MCP_ENABLED
    value: ${MCP_ENABLED}
  - name: MCP_NAME
    value: ${MCP_NAME}
  - name: MCP_URL
    value: ${MCP_URL}
  - name: MCP_APPROVAL_MODE
    value: ${MCP_APPROVAL_MODE}
