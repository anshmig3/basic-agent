[project]
name = "basic-agent"
version = "0.1.0"
description = "A conversational agent built with Microsoft Agent Framework, deployable to Azure AI Foundry."
requires-python = ">=3.10"
dependencies = [
    "agent-framework",
    "azure-ai-projects>=2.0.0",
    "azure-identity",
    "python-dotenv",
]

[project.scripts]
basic-agent-chat = "basic_agent.chat:run"
basic-agent-remote-chat = "basic_agent.foundry_runtime:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_agent"]
